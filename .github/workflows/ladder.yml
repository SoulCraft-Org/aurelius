name: ladder

# Scores seats on rungs in sim, by hand. Run it from the Actions tab or with
# `gh workflow run ladder.yml -R SoulCraft-Org/aurelius`; it runs only on a dispatch, from the branch you pick.
# Each seat and rung runs `python3 -m ladder.run` (3 seeds; 1 seed for r103823), the rows join into one list in
# scores.json, and that file is uploaded as an artifact. It never pushes and never writes to the repo.
# Keep each pin a full commit SHA with its version comment; Dependabot's github-actions entry bumps them.
on:
  workflow_dispatch:
    inputs:
      seats:
        description: "Seats, comma separated: rule, one_agent, flat_fan_out, cheapest_that_passes, model (r10 and r47 only)"
        default: "rule,one_agent,flat_fan_out,cheapest_that_passes"
        type: string
      rungs:
        description: "Rungs, comma separated: r10, r47, r2209, r103823"
        default: "r10,r47,r2209,r103823"
        type: string

permissions:
  contents: read

# A second dispatch on the same ref waits for the first; a finished run is never cut short.
concurrency:
  group: ladder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Score every seat on every rung
        env:
          SEATS: ${{ inputs.seats }}
          RUNGS: ${{ inputs.rungs }}
          PYTHONHASHSEED: "0"
          # Copied into an unexported shell variable, then unset: only the model seat's runs get it (see the loop).
          ROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          set -f
          key="$ROUTER_KEY"
          unset ROUTER_KEY
          allowed_seats=" rule one_agent flat_fan_out cheapest_that_passes model "
          allowed_rungs=" r10 r47 r2209 r103823 "
          seats=${SEATS//,/ }
          rungs=${RUNGS//,/ }
          [ -n "${seats//[[:space:]]/}" ] && [ -n "${rungs//[[:space:]]/}" ] || { echo "seats and rungs must not be empty" >&2; exit 1; }
          seen=" "
          for s in $seats; do
            case "$allowed_seats" in *" $s "*) ;; *) echo "unknown seat: not in the allow-list" >&2; exit 1 ;; esac
            case "$seen" in *" $s "*) echo "a seat is listed twice" >&2; exit 1 ;; esac
            seen="$seen$s "
          done
          for r in $rungs; do
            case "$allowed_rungs" in *" $r "*) ;; *) echo "unknown rung: not in the allow-list" >&2; exit 1 ;; esac
          done
          # The model seat costs money: r10 and r47 only, and one $1 ceiling split across the rungs it runs on.
          model_rungs=0
          case "$seen" in *" model "*)
            for r in $rungs; do
              case "$r" in r10|r47) model_rungs=$((model_rungs + 1)) ;; *) echo "the model seat runs on r10 and r47 only" >&2; exit 1 ;; esac
            done ;;
          esac
          rows="$RUNNER_TEMP/rows"
          mkdir -p "$rows"
          n=0
          for r in $rungs; do
            seeds=3
            [ "$r" = r103823 ] && seeds=1
            for s in $seats; do
              n=$((n + 1))
              out="$rows/$(printf '%03d' "$n").json"
              if [ "$s" = model ]; then
                cap=$(python3 -I -c "import sys; print(1.0 / int(sys.argv[1]))" "$model_rungs")
                OPENROUTER_API_KEY="$key" MODEL_CAP_USD="$cap" python3 -m ladder.run --rung "$r" --seat "$s" --seeds "$seeds" > "$out"
              else
                python3 -m ladder.run --rung "$r" --seat "$s" --seeds "$seeds" > "$out"
              fi
            done
          done
          python3 -I - "$rows" scores.json <<'PY'
          import json, os, sys
          from pathlib import Path
          rows = [json.loads(p.read_text()) for p in sorted(Path(sys.argv[1]).glob("*.json"))]
          Path(sys.argv[2]).write_text(json.dumps(rows, indent=2) + "\n")
          fmt = lambda v: "n/a" if v is None else f"{v:.2f}"
          out = ["| Rung | Seat | Verified % | Cost per verified | Critical steps | Seeds |", "|---|---|---|---|---|---|"]
          for r in rows:
              m = r["metrics"]
              out.append(f"| {r['rung']} | {r['seat']} | {fmt(m['verified_success'])} | "
                         f"{fmt(m['cost_per_verified_success'])} | {fmt(m['critical_steps'])} | {len(r['seed'])} |")
          out.append("")
          out.append("Every score is sim. The full rows are in the scores.json artifact.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scores
          path: scores.json
          if-no-files-found: error
