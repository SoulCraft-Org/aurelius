<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Aurelius tree: 1 seat, 47 seats, 2,209 seats, 103,823 workers">
<title>Aurelius tree: 1 seat, 47 seats, 2,209 seats, 103,823 workers</title>
<style>
.g{fill:#C9971C}.v{fill:#7457E0}
text{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8A6BF0}
text.k{fill:#C9971C}
.t{opacity:.6;animation:dn 4s ease-in-out infinite both}
.a1{animation-delay:.3s}.a2{animation-delay:.75s}.a3{animation-delay:1.1s}
.rl{opacity:0;animation:up 4s ease-in-out infinite both}
.a4{animation-delay:2.25s}.a5{animation-delay:2.85s}
.od,.su{opacity:0;stroke-width:1.5}
.od{fill:#C9971C;stroke:#4A3699;animation:down 4s linear infinite}
.su{fill:#7457E0;stroke:#C9971C;animation:rise 4s linear infinite}
.rg{fill:none;stroke:#7457E0;stroke-width:2;opacity:0;transform-origin:540px 34px;animation:ring 4s ease-out infinite}
@keyframes dn{0%,100%{opacity:.6}8%{opacity:1}22%{opacity:.6}}
