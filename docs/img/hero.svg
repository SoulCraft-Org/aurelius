@keyframes down{0%{transform:translateY(0);opacity:0}4%{opacity:1}44%{transform:translateY(218px);opacity:1}50%,100%{transform:translateY(218px);opacity:0}}
@keyframes rise{0%,50%{transform:translateY(218px);opacity:0}54%{opacity:1}96%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes ring{0%,90%{opacity:0;transform:scale(1)}96%{opacity:.9;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t{opacity:.9}.od,.su,.rg,.rl{opacity:0}}
</style>
<defs>
